name: VerifyAI CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-gate:
    name: Backend Tests & Evaluation Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest -v --tb=short

      - name: Run Empirical 20-Case Benchmark Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m app.benchmark.runner

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evaluation-results
          path: |
            backend/app/benchmark/benchmark_results.json
            backend/app/benchmark/benchmark_results.csv

  frontend-quality-gate:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck and Build Bundle
        working-directory: ./frontend
        run: npm run build
